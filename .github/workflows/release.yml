name: Release

# Manual-dispatch release job (Phase 16 / S5 step 7): builds Release and stages a
# standalone dist/<app> for a named in-tree project, then uploads it as an artifact.
# Per-app icon embedding / installer compilation is done from Starforge's Package UI
# (or locally with installer/AppSetup.iss); this job produces the runnable payload.
#
# ONE package layout (AP-P1): the staging below is not hand-written any more, it calls
# installer/Stage-AppPackage.ps1 — the same script package.bat <App> calls, mirroring
# the editor packager (Projects/Starforge/src/Packager.cpp). All three paths therefore
# emit the identical file list:
#   <App>.exe  <App>.dll  Cosmic.dll  boot.cfg  assets/  assets/projects/<App>/
#   licenses/  user/README.txt
# `cmake --install` still works but is NOT a shipping path (see package.bat's header).

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Project/plugin to package (its DLL must build in Release, e.g. SF_Telem or Starforge - the 2D-only trunk ships these)"
        required: true
        default: "Starforge"

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Explicit 2D configure (WO-03). Combined with the root CMakeLists rejecting
      # COSMIC_2D_ONLY=OFF, a release run cannot produce a 3D or mixed distributable:
      # editing this flag to OFF fails the configure outright, and the assertion
      # below re-checks the generated cache before any staging happens.
      # COSMIC_BUILD_TESTS=OFF: CosmicTests/CosmicRenderTests are developer-only
      # targets that must never be built into, let alone staged from, a release tree.
      - name: Configure (2D-only engine)
        run: cmake -S . -B build -A x64 -DCOSMIC_2D_ONLY=ON -DCOSMIC_BUILD_TESTS=OFF

      - name: Assert 2D mode in cache
        shell: pwsh
        run: |
          $hit = Select-String -Path build/CMakeCache.txt -Pattern '^COSMIC_2D_ONLY:BOOL=ON$' -Quiet
          if (-not $hit) { throw "Release refused: build/CMakeCache.txt is not COSMIC_2D_ONLY=ON — will not stage a non-2D distributable." }
          Write-Output "Confirmed: staging a 2D-only distributable (COSMIC_2D_ONLY:BOOL=ON)."

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Stage dist (one layout)
        shell: powershell
        run: |
          $app = "${{ github.event.inputs.app_name }}"
          ./installer/Stage-AppPackage.ps1 `
            -SdkRoot (Get-Location).Path `
            -App $app `
            -RuntimeDir "build/Runtime/Release" `
            -OutDir "dist/$app" `
            -ListOut "dist/$app.files.txt"
          if ($LASTEXITCODE -ne 0) { throw "Staging failed (exit $LASTEXITCODE)." }
          Get-Content "dist/$app.files.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-dist
          path: dist/${{ github.event.inputs.app_name }}

      # The sorted relative-path list of the staged tree. AP-P1's one-layout contract
      # is checked by diffing this against the editor path's and package.bat's lists.
      - name: Upload file list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-file-list
          path: dist/${{ github.event.inputs.app_name }}.files.txt
          if-no-files-found: warn
