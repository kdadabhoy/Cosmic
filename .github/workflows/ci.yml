name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # S13.1 conformance audit (doc 05 §12): no raw gl*/GL_* tokens outside
      # platform/OpenGL/ — every GPU operation goes through RendererAPI verbs.
      - name: GL conformance audit
        shell: pwsh
        run: ./tests/check_gl_conformance.ps1

      # API reference coverage audit (doc 12 work order D5): every public header
      # has a row in docs/reference/README.md's coverage manifest, no row points
      # at a header that no longer exists, the 2D/3D markers match the build, and
      # a chapter that has lost its STATUS: SKELETON banner names every
      # COSMIC_API class its headers declare.
      - name: API reference coverage audit
        shell: pwsh
        run: ./tests/check_docs_coverage.ps1

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build
          key: cmake-build-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'Cosmic/CMakeLists.txt', 'Runtime/CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: |
            cmake-build-${{ runner.os }}-

      - name: Configure
        run: cmake -S . -B build -A x64 -DCOSMIC_BUILD_TESTS=ON

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Run unit tests
        working-directory: build/Runtime/Release
        run: ./CosmicTests.exe --reporters=console --no-intro

      # Packaging is intentionally not part of CI yet — see
      # docs/plans/07-installer-packaging-plan.md step 6 for the release job.
