name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 2D stability trunk PR gate (WO-03). Every configure here is the 2D engine
# (-DCOSMIC_2D_ONLY=ON); the root CMakeLists also rejects OFF, so CI can never
# build or test a 3D/mixed tree. GPU golden-image tests are NOT here — they need
# a real GPU and live in gpu-qualification.yml (scheduled / dispatched, on a
# self-hosted GPU runner), so this job stays non-blocking on GPU hardware.
jobs:
  build-and-test:
    runs-on: windows-latest

    env:
      COSMIC_MODE: 2d          # build-mode token, folded into the cache key below
      COSMIC_ARCH: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # S13.1 conformance audit (doc 05 §12): no raw gl*/GL_* tokens outside
      # platform/OpenGL/ — every GPU operation goes through RendererAPI verbs.
      - name: GL conformance audit
        shell: pwsh
        run: ./tests/check_gl_conformance.ps1

      # API reference coverage audit (doc 12 work order D5): every public header
      # has a row in docs/reference/README.md's coverage manifest, no row points
      # at a header that no longer exists, the 2D/3D markers match the build, and
      # a chapter that has lost its STATUS: SKELETON banner names every
      # COSMIC_API class its headers declare.
      - name: API reference coverage audit
        shell: pwsh
        run: ./tests/check_docs_coverage.ps1

      # Markdown link audit (App Platform AP-D1, DOC01/DOC04): every relative file link
      # and #anchor in the live documentation tiers resolves; archived and parked
      # tiers are warn-only.
      - name: Markdown link audit
        shell: pwsh
        run: ./tests/check_docs_links.ps1

      # Toolchain identity for the cache key. The compiler version changes with the
      # windows-latest image, and a cache restored across a compiler bump can hand
      # the build stale, ABI-incompatible objects — so it becomes part of the key.
      - name: Resolve toolchain id
        id: toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $ver = (& $vswhere -latest -products * -property installationVersion).Trim()
          if (-not $ver) { $ver = "unknown" }
          Write-Output "ver=$ver" >> $env:GITHUB_OUTPUT
          Write-Output "MSVC toolset: $ver"

      # Mode-aware build cache (WO-03 / KI-3). The old key hashed only the
      # CMakeLists files, so flipping the build mode could restore a stale
      # opposite-mode build/ directory. The key now carries the 2D/3D MODE token,
      # the architecture and the MSVC toolchain version alongside the CMake file
      # hashes, so a different mode / arch / compiler can never collide on one
      # cache entry. The restore-keys prefix is likewise mode+arch+toolchain
      # scoped so a partial restore can only reuse a SAME-mode build.
      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build
          key: cmake-build-${{ runner.os }}-${{ env.COSMIC_MODE }}-${{ env.COSMIC_ARCH }}-msvc${{ steps.toolchain.outputs.ver }}-${{ hashFiles('CMakeLists.txt', 'Cosmic/CMakeLists.txt', 'Runtime/CMakeLists.txt', 'tests/CMakeLists.txt', 'Projects/Starforge/CMakeLists.txt', 'CMakePresets.json', '.github/workflows/ci.yml') }}
          restore-keys: |
            cmake-build-${{ runner.os }}-${{ env.COSMIC_MODE }}-${{ env.COSMIC_ARCH }}-msvc${{ steps.toolchain.outputs.ver }}-

      - name: Configure (2D-only engine)
        run: cmake -S . -B build -A ${{ env.COSMIC_ARCH }} -DCOSMIC_2D_ONLY=ON -DCOSMIC_BUILD_TESTS=ON

      # Guard: prove the configured tree really is 2D before spending a build on it.
      # If a stale cache or a bad flag left COSMIC_2D_ONLY OFF, the root CMakeLists
      # would already have failed the configure — this is a cheap belt-and-suspenders
      # assertion that the cache we are about to build carries the 2D contract.
      - name: Assert 2D mode in cache
        shell: pwsh
        run: |
          $hit = Select-String -Path build/CMakeCache.txt -Pattern '^COSMIC_2D_ONLY:BOOL=ON$' -Quiet
          if (-not $hit) { throw "CMakeCache does not carry COSMIC_2D_ONLY=ON — refusing to build a non-2D tree." }
          Write-Output "Confirmed: build/CMakeCache.txt has COSMIC_2D_ONLY:BOOL=ON"

      - name: Build (Debug)
        run: cmake --build build --config Debug --parallel

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      # Test-discovery guard (WO-03 / B05): a green process exit is NOT enough —
      # a suite that silently filtered down to zero cases, or a renamed/missing
      # executable, must fail CI. `--count` prints the number of matching test
      # cases; we require it to clear a floor well below the known ~340 so an
      # empty or degenerate suite is caught while normal suite growth is not.
      - name: Test discovery check
        shell: pwsh
        working-directory: build/Runtime
        run: |
          $floor = 300
          foreach ($cfg in @('Debug','Release')) {
            $exe = "$cfg/CosmicTests.exe"
            if (-not (Test-Path $exe)) { throw "Expected test binary '$exe' not found (renamed or not built?)." }
            $out = & $exe --count --no-intro 2>&1 | Out-String
            $m = [regex]::Match($out, 'test cases[^0-9]*([0-9]+)')
            if (-not $m.Success) { throw "Could not read a test-case count from $cfg CosmicTests --count output:`n$out" }
            $n = [int]$m.Groups[1].Value
            Write-Output "$cfg CosmicTests discovered $n test cases (floor $floor)."
            if ($n -lt $floor) { throw "$cfg test suite has $n cases, below the floor of $floor — suite empty, over-filtered or renamed." }
          }

      # doctest's console reporter, teed to a log file so the run stays visible in
      # the Actions console AND lands as an uploadable report. $LASTEXITCODE is the
      # real gate — a nonzero exit fails the step even though Tee-Object succeeds.
      - name: Run unit tests (Debug)
        shell: pwsh
        working-directory: build/Runtime/Debug
        run: |
          & ./CosmicTests.exe --reporters=console --no-intro 2>&1 | Tee-Object -FilePath ../../../test-results-debug.txt
          if ($LASTEXITCODE -ne 0) { throw "Debug unit tests failed (exit $LASTEXITCODE)." }

      - name: Run unit tests (Release)
        shell: pwsh
        working-directory: build/Runtime/Release
        run: |
          & ./CosmicTests.exe --reporters=console --no-intro 2>&1 | Tee-Object -FilePath ../../../test-results-release.txt
          if ($LASTEXITCODE -ne 0) { throw "Release unit tests failed (exit $LASTEXITCODE)." }

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-2d-test-reports
          path: |
            test-results-debug.txt
            test-results-release.txt
          if-no-files-found: warn

      # Packaging is intentionally not part of this PR gate - see release.yml for the
      # manual-dispatch 2D distributable job, and package.bat's header for which of the
      # packaging paths actually ships (AP-P1: the editor packager, package.bat <App>
      # and release.yml all stage one layout; `cmake --install` does not ship).

  # ---------------------------------------------------------------------------------
  # H05 - the acceptance runner's `pr` profile, after the units.
  #
  # Runs tests/acceptance/Run-Acceptance.ps1 -Profile pr over every manifest that
  # carries the pr profile (manifests/pr-*.manifest.json, plus ap05-purge.manifest.json
  # once AP-05 lands it). The job FAILS on any FAILED/TIMEOUT/MISSING case. Cases whose
  # tier this runner cannot honour - G (GPU), I (real editor UI), Q (qualified/soak) -
  # come back as ENVIRONMENT_BLOCKED with the missing prerequisite named in results.json
  # and are never counted as passes; a hosted runner has no GPU, no interactive desktop
  # session and no serial equipment. A profile that selects ZERO cases is a failure
  # (runner exit 2), so this can never degenerate into a green no-op.
  #
  # It reuses build-and-test's build through the same cache entry rather than rebuilding.
  # If the restore does not produce the test binaries the job fails loudly - it never
  # skips quietly.
  # ---------------------------------------------------------------------------------
  acceptance-pr:
    needs: build-and-test
    runs-on: windows-latest

    env:
      COSMIC_MODE: 2d
      COSMIC_ARCH: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve toolchain id
        id: toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $ver = (& $vswhere -latest -products * -property installationVersion).Trim()
          if (-not $ver) { $ver = "unknown" }
          Write-Output "ver=$ver" >> $env:GITHUB_OUTPUT

      # Same key as build-and-test, so this job gets exactly the tree that job built
      # and tested - not a rebuild that could differ.
      - name: Restore CMake build
        uses: actions/cache/restore@v4
        with:
          path: build
          key: cmake-build-${{ runner.os }}-${{ env.COSMIC_MODE }}-${{ env.COSMIC_ARCH }}-msvc${{ steps.toolchain.outputs.ver }}-${{ hashFiles('CMakeLists.txt', 'Cosmic/CMakeLists.txt', 'Runtime/CMakeLists.txt', 'tests/CMakeLists.txt', 'Projects/Starforge/CMakeLists.txt', 'CMakePresets.json', '.github/workflows/ci.yml') }}
          restore-keys: |
            cmake-build-${{ runner.os }}-${{ env.COSMIC_MODE }}-${{ env.COSMIC_ARCH }}-msvc${{ steps.toolchain.outputs.ver }}-

      - name: Assert the restored tree is the 2D build that was tested
        shell: pwsh
        run: |
          foreach ($f in @('build/CMakeCache.txt','build/Runtime/Release/CosmicTests.exe')) {
            if (-not (Test-Path $f)) { throw "Acceptance cannot run: '$f' is missing from the restored build. Refusing to report a green acceptance run without the binaries the units were run on." }
          }
          $hit = Select-String -Path build/CMakeCache.txt -Pattern '^COSMIC_2D_ONLY:BOOL=ON$' -Quiet
          if (-not $hit) { throw "Restored CMakeCache does not carry COSMIC_2D_ONLY=ON - refusing to accept a non-2D tree." }
          Write-Output "Restored 2D build confirmed; running the acceptance pr profile against build/Runtime/Release."

      - name: Acceptance runner (profile pr)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $manifests = @(Get-ChildItem 'tests/acceptance/manifests/pr-*.manifest.json' | Sort-Object Name)
          # AP-05 contributes its purge case under its own name; picked up once it lands.
          $ap05 = 'tests/acceptance/manifests/ap05-purge.manifest.json'
          if (Test-Path $ap05) { $manifests += Get-Item $ap05 }
          if ($manifests.Count -eq 0) { throw "No pr-*.manifest.json found - a profile with nothing to run is a failure, not a pass." }

          $resultsRoot = Join-Path (Get-Location).Path 'acceptance-results'
          New-Item -ItemType Directory -Force -Path $resultsRoot | Out-Null
          $failed = @()
          foreach ($m in $manifests) {
            $name = [IO.Path]::GetFileNameWithoutExtension($m.Name)
            Write-Host "=== acceptance: $name ==="
            & ./tests/acceptance/Run-Acceptance.ps1 -Manifest $m.FullName -Profile pr -Config Release -OutDir (Join-Path $resultsRoot $name)
            if ($LASTEXITCODE -ne 0) { $failed += ("{0} (exit {1})" -f $name, $LASTEXITCODE) }
          }

          # One honest summary over every case the profile ran.
          $tot = 0; $pass = 0; $blocked = 0; $bad = 0
          foreach ($j in Get-ChildItem 'acceptance-results' -Recurse -Filter 'results.json') {
            $r = Get-Content $j.FullName -Raw | ConvertFrom-Json
            $tot += $r.counts.total; $pass += $r.counts.passed
            $blocked += $r.counts.blocked; $bad += $r.counts.failed
            foreach ($c in $r.cases) {
              if ($c.verdict -eq 'ENVIRONMENT_BLOCKED') { Write-Host ("  [BLOCKED] {0} ({1}) - {2}" -f $c.id, $c.tier, $c.detail) }
              elseif ($c.verdict -ne 'PASSED')          { Write-Host ("  [{0}] {1} ({2}) - {3}" -f $c.verdict, $c.id, $c.tier, $c.detail) }
            }
          }
          Write-Host ("=== acceptance pr: {0} passed / {1} failed / {2} env-blocked (of {3}) ===" -f $pass, $bad, $blocked, $tot)
          if ($tot -eq 0) { throw "The pr profile selected zero cases - a filtered suite with no expected tests is a FAILURE." }
          if ($failed.Count -gt 0) { throw ("Acceptance pr profile failed: " + ($failed -join '; ')) }

      - name: Upload acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-acceptance-pr
          path: |
            acceptance-results/**/results.json
            acceptance-results/**/results.junit.xml
          if-no-files-found: error
