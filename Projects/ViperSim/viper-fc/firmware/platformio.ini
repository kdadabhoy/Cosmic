; viper-fc firmware — Teensy 4.1 (doc 04 §1: PlatformIO + Arduino framework).
;
; The flight code is the SAME header-only viperfc library the sim runs
; (../include); Framing.h is included straight from the engine tree — it is
; deliberately freestanding (no STL, no heap) for exactly this build.
;
;   pio run            — compile
;   pio run -t upload  — flash the Teensy 4.1

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -std=gnu++17
    -I ../include
    -I ../../../../Cosmic/src
build_unflags = -std=gnu++14
